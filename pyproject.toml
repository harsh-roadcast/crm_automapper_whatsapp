[project]
name = "crm-automapper-whatsapp"
version = "0.1.0"
description = "WhatsApp lead qualification chatbot with Zoho CRM auto-mapping"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
	"alembic>=1.16.0",
	"asyncpg>=0.30.0",
	"celery>=5.5.0",
	"fastapi>=0.116.0",
	"greenlet>=3.2.4",
	"httpx>=0.28.0",
	"pydantic-settings>=2.10.0",
	"redis>=6.0.0",
	"sqlalchemy>=2.0.41",
	"uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
	"aiosqlite>=0.21.0",
	"pytest>=8.4.0",
	"pytest-asyncio>=1.0.0",
	"respx>=0.22.0",
]
